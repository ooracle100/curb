name: Daily premium snapshot

on:
  schedule:
    # 06:05 UTC daily. GitHub's scheduler can run late; that is fine, one record per day.
    - cron: "5 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rates
        run: python scripts/fetch_rates.py

      - name: Anchor on Base
        env:
          ATTEST_PRIVATE_KEY: ${{ secrets.ATTEST_PRIVATE_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: python scripts/attest.py

      - name: Commit the day's record
        run: |
          git config user.name "premium-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
